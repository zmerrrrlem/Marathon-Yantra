name: Build ROS 2 Jazzy Workspace

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
          
        # Cache APT packages
      - name: Cache APT packages
        uses: actions/cache@v3
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('**/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

        # Cache rosdep and .ros
      - name: Cache rosdep and .ros
        uses: actions/cache@v3
        with:
          path: |
            ~/.ros/rosdep
            ~/.ros/rosdep/sources.cache
          key: ${{ runner.os }}-rosdep-${{ hashFiles('**/jazzy.repos') }}
          restore-keys: |
            ${{ runner.os }}-rosdep-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-colcon-common-extensions python3-vcstool ros-jazzy-dynamixel-sdk ros-jazzy-xacro ros-jazzy-rqt ros-jazzy-rviz2 ros-jazzy-yaml-cpp-vendor ros-jazzy-vision-msgs ros-jazzy-nav-msgs ros-jazzy-orocos-kdl-vendor ros-jazzy-joint-trajectory-controller ros-jazzy-joint-state-publisher ros-jazzy-joint-state-publisher-gui  ros-jazzy-joint-limits ros-jazzy-interactive-markers ros-jazzy-image-geometry ros-jazzy-imu-sensor-broadcaster ros-jazzy-kinematics-interface ros-jazzy-libyaml-vendor libserial-dev libserialport-dev libserial1 ros-jazzy-examples-rclcpp-minimal-subscriber ros-jazzy-examples-rclcpp-minimal-publisher 
          sudo apt install ros-jazzy-ros2-control ros-jazzy-hardware-interface ros-jazzy-forward-command-controller ros-jazzy-filters ros-jazzy-controller-manager ros-jazzy-controller-manager-msgs ros-jazzy-control-toolbox ros-jazzy-controller-interface ros-jazzy-ros2controlcli ros-jazzy-ros2component ros-jazzy-pid-controller ros-jazzy-joint-state-broadcaster
          sudo apt install ros-jazzy-moveit ros-jazzy-rmw-cyclonedds-cpp ros-jazzy-cyclonedds  ros-jazzy-moveit-ros-control-interface ros-jazzy-ompl
          vcs import src < jazzy.repos || true
          sudo rosdep init || true
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
          colcon build --packages-select dynamixel_workbench_toolbox altair_description altair_moveit_config biped_interfaces altair_msgs dynamixel_msgs ros2_python_extension dynamixel_hardware bio_ik rot_conv altair_splines quintic_walk

