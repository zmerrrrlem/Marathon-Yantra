# NOTE: This file must stay in sync with src/cubic_walk_parameters.yaml
# (the schema/validation source used by generate_parameter_library).
# Parameter names and defaults here must match the YAML schema exactly.
/cubic_walk:
  ros__parameters:
    engine:
      double_support_ratio: 0.07
      first_step_swing_factor: 0.3
      first_step_trunk_phase: -0.5
      foot_apex_phase: 0.5
      foot_apex_pitch: 0.0
      foot_distance: 0.13
      foot_overshoot_phase: 1.0
      foot_overshoot_ratio: 0.0
      foot_put_down_phase: 1.0
      foot_put_down_z_offset: 0.0
      foot_rise: 0.025
      foot_z_pause: 0.0
      freq: 1.3
      kick_length: 0.12
      kick_phase: 0.28
      kick_put_down_phase: 0.8
      kick_rise_factor: 1.5
      kick_vel: 0.2
      trunk_height: 0.28
      trunk_pause: 0.0
      trunk_phase: -0.1
      trunk_pitch: 0.1
      trunk_pitch_p_coef_forward: 0.0
      trunk_pitch_p_coef_turn: 0.0
      trunk_swing: 0.2
      trunk_x_offset: 0.0
      trunk_x_offset_p_coef_forward: 0.0
      trunk_x_offset_p_coef_turn: 0.0
      trunk_y_offset: 0.0
      trunk_z_movement: 0.0
      arm_swing_enabled: true
      arm_shoulder_pitch_amp: 0.2
      arm_shoulder_roll_amp: 0.1
      arm_elbow_bend: -1.2
    is_async: true
    node:
      debug_active: true
      engine_freq: 200.0
      ik:
        reset: true
        timeout: 0.15
      imu_y_acc_tau: 0.2
      max_step_angular: 0.5
      max_step_x: 0.2
      max_step_xy: 0.2
      max_step_y: 0.15
      max_step_z: 0.1
      phase_reset:
        effort:
          active: false
          joint_min_effort: 2.0
        foot_pressure:
          active: true
          ground_min_pressure: 1.5
        imu:
          active: true
          y_acceleration_threshold: 2.0
        min_phase: 0.9
      stability_stop:
        imu:
          active: true
          pitch:
            threshold: 0.3
            vel_threshold: 2.0
          roll:
            threshold: 0.5
            vel_threshold: 6.0
        pause_duration: 3.0
      tf:
        base_link_frame: body_link
        l_sole_frame: left_leg_pitch_5
        odom_frame: odom
        r_sole_frame: right_leg_pitch_6
      trunk_pid:
        pitch:
          antiwindup: false
          d: 0.05
          i: 0.0
          i_clamp_max: 0.0
          i_clamp_min: 0.0
          p: 0.3
          save_i_term: false
        roll:
          antiwindup: false
          d: 0.05
          i: 0.0
          i_clamp_max: 0.0
          i_clamp_min: 0.0
          p: 0.3
          save_i_term: false
      x_bias: 0.0
      x_speed_multiplier: 1.0
      y_bias: 0.0
      y_speed_multiplier: 1.0
      yaw_bias: 0.0
      yaw_speed_multiplier: 1.0
    qos_overrides:
      /tf:
        publisher:
          depth: 50
          durability: volatile
          history: keep_last
          reliability: reliable
    robot_name: alta
    start_type_description_service: true
    thread_priority: 50
    update_rate: 75
    use_sim_time: true

