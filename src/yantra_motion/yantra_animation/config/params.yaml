controller_manager:
  ros__parameters:
    update_rate: 30  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    yantra_animation:
      type: yantra_animation/YantraAnimation

imu_sensor_broadcaster:
  ros__parameters:
    type: imu_sensor_broadcaster/IMUSensorBroadcaster
    sensor_name: imu_sensor
    frame_id: imu_link

yantra_animation:
  ros__parameters:
    play:
      - "hello"
